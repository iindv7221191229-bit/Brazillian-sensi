<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Sensitivity Engine</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#070b14;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.app{
  width:92%;
  max-width:450px;
  background:#121a2a;
  padding:20px;
  border-radius:16px;
  text-align:center;
}

h1{
  color:#00ffcc;
  font-size:20px;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
  outline:none;
}

button{
  width:100%;
  padding:10px;
  margin-top:8px;
  background:#00ffcc;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

#result{
  margin-top:15px;
  background:#0f1626;
  padding:10px;
  border-radius:10px;
  text-align:left;
}
</style>

</head>

<body>

<div class="app">

<h1>🧠 AI SENSITIVITY ENGINE</h1>

<input type="text" id="device" placeholder="Enter device name">
<input type="number" id="ram" placeholder="RAM (GB)">
<input type="number" id="fps" placeholder="FPS (30/60/90/120)">

<button onclick="autoDetect()">Auto Detect Device</button>
<button onclick="generateSensi()">Generate Sensitivity</button>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
  </html>
